# Shot list for the guide: one entry per screenshot, clip and GIF used in docs/.
# Format: see research SPEC (id, kind, page, persona, device, url, state, steps, callouts, caption, captions, duration).
# Devices: tablet = 1180x820 landscape, phone = 390x844, desktop = 1440x900. Base URL http://localhost:9080 (local guide stack, demo data only).
# Screenshots go to docs/assets/img/<section>/<id>.png (section = page folder, 'general' for top-level pages),
# clips to docs/assets/video/<id>.mp4/.webm/.vtt/.jpg, GIFs to docs/assets/gif/<id>.gif.
# URL placeholders: {kart:NNN} = id of the Demo Hub kart shown as NNN (e.g. {kart:207}), {campaign} = id of Junior caliper seal upgrade,
# {task:NNN} = that campaign's task for kart NNN, {hub} = Demo Hub id. Callout targets are Playwright-style selectors (text=, role=, label=, css=).
# Clip captions: one VTT cue per line, each shown 2 to 6 seconds while that action happens; leave silent gaps between cues on longer clips.
- id: fc-checklist-clip
  kind: clip
  page: fkl-central/checklists.md
  persona: Taylor Central
  device: desktop
  url: /fkl-central?tab=checklists
  state: Published Bambino, Cadet and Junior v1 checklists; no open drafts
  steps:
  - Open FKL Central, Service checklists, Cadet
  - Tap New draft
  - Open the Steering section, tap Add check, type the Label, tap Save check
  - Show Check before publishing with No errors
  - Tap Publish, type What changed and tap Publish
  caption: making a draft of the Cadet checklist, adding a check and publishing it
  captions:
  - Open Service checklists.
  - Make a new draft for the class.
  - Add or change checks.
  - Check it before publishing.
  - Publish with a note of what changed.
  duration: 50
